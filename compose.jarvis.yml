services:
  nodered:
    image: nodered/node-red:4.1.8
    user: ${NODERED_USER:-0:0}
    ports:
      - "1880:1880"
    volumes:
      - ${NODERED_DATA_PATH:-./.data/nodered}:/data
      - ${JARVIS_FLOWS_HOST_PATH:-./jarvis/flows/nodered/exports}:/flows:ro
    environment:
      LLM_ADAPTER_URL: http://llm_adapter:8010
      OPENPROJECT_ADAPTER_URL: http://openproject_adapter:8020
      TOOLBOX_RUNNER_URL: http://toolbox_runner:8030
      GIT_BRIDGE_URL: http://git_bridge:8040
      LOG_BRIDGE_URL: http://log_bridge:8050
      REPO_PATH: /workspace/jarvis-nodered
    networks:
      - jarvis_net
      
  devlab_backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
      - /opt/jarvis/database:/opt/jarvis/database
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      TOOLBOX_RUNNER_URL: http://toolbox_runner:8030
      LLM_ADAPTER_URL: http://llm_adapter:8010
      JARVIS_INFRA_DB: /opt/jarvis/database/jarvis.db
      TRACE_MONITOR_URL: ${JARVIS_TRACE_MONITOR_URL:-http://jarvis_debug_studio:8060}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_GATEWAY_URL: ${TRACE_GATEWAY_URL:-http://jarvis_debug_studio:8060}
      TRACE_CODE_PREVIEW: ${TRACE_CODE_PREVIEW:-true}
      TRACE_MAX_CODE_LINES: ${TRACE_MAX_CODE_LINES:-160}
    command: bash -lc "REQ=/app/services/devlab_backend/requirements.txt; [ -f "$$REQ" ] || REQ=services/devlab_backend/requirements.txt; if [ -f "$$REQ" ]; then pip install --no-cache-dir -r "$$REQ"; else pip install --no-cache-dir fastapi uvicorn httpx pydantic jsonschema ruff; fi && uvicorn services.devlab_backend.app:app --host 0.0.0.0 --port 8090"
    ports:
      - "8090:8090"
    networks:
      - jarvis_net

  llm_adapter:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      TRACE_MONITOR_URL: ${JARVIS_TRACE_MONITOR_URL:-http://jarvis_debug_studio:8060}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_GATEWAY_URL: ${TRACE_GATEWAY_URL:-http://jarvis_debug_studio:8060}
      TRACE_CODE_PREVIEW: ${TRACE_CODE_PREVIEW:-true}
      TRACE_MAX_CODE_LINES: ${TRACE_MAX_CODE_LINES:-160}
    command: bash -lc "REQ=/app/services/llm_adapter/requirements.txt; [ -f \"$$REQ\" ] || REQ=services/llm_adapter/requirements.txt; if [ -f \"$$REQ\" ]; then pip install --no-cache-dir -r \"$$REQ\"; else pip install --no-cache-dir fastapi uvicorn httpx pydantic; fi && uvicorn services.llm_adapter.app:app --host 0.0.0.0 --port 8010"
    ports:
      - "8010:8010"
    networks:
      - jarvis_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  openproject_adapter:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      TRACE_MONITOR_URL: ${JARVIS_TRACE_MONITOR_URL:-http://jarvis_debug_studio:8060}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_GATEWAY_URL: ${TRACE_GATEWAY_URL:-http://jarvis_debug_studio:8060}
      TRACE_CODE_PREVIEW: ${TRACE_CODE_PREVIEW:-true}
      TRACE_MAX_CODE_LINES: ${TRACE_MAX_CODE_LINES:-160}
    command: bash -lc "REQ=/app/services/openproject_adapter/requirements.txt; [ -f \"$$REQ\" ] || REQ=services/openproject_adapter/requirements.txt; if [ -f \"$$REQ\" ]; then pip install --no-cache-dir -r \"$$REQ\"; else pip install --no-cache-dir fastapi uvicorn jsonschema; fi && uvicorn services.openproject_adapter.app:app --host 0.0.0.0 --port 8020"
    ports:
      - "8020:8020"
    networks:
      - jarvis_net

  toolbox_runner:
    image: python:3.11-slim
    container_name: jarvis_toolbox_runner
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
      - /opt/jarvis/database:/opt/jarvis/database
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      TOOL_TIMEOUT_S: 30
      JARVIS_INFRA_DB: /opt/jarvis/database/jarvis.db
      TRACE_MONITOR_URL: ${JARVIS_TRACE_MONITOR_URL:-http://jarvis_debug_studio:8060}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_GATEWAY_URL: ${TRACE_GATEWAY_URL:-http://jarvis_debug_studio:8060}
      TRACE_PAYLOADS: ${TRACE_PAYLOADS:-true}
      TRACE_CODE_PREVIEW: ${TRACE_CODE_PREVIEW:-true}
      TRACE_MAX_CODE_LINES: ${TRACE_MAX_CODE_LINES:-160}
    command: bash -lc "REQ=/app/services/toolbox_runner/requirements.txt; [ -f \"$$REQ\" ] || REQ=services/toolbox_runner/requirements.txt; if [ -f \"$$REQ\" ]; then pip install --no-cache-dir -r \"$$REQ\"; else pip install --no-cache-dir fastapi uvicorn jsonschema pydantic; fi && uvicorn services.toolbox_runner.app:app --host 0.0.0.0 --port 8030"
    ports:
      - "8030:8030"
    networks:
      - jarvis_net

  jarvis_debug_studio:
    image: python:3.11-slim
    container_name: jarvis_debug_studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
      - /opt/jarvis/database:/opt/jarvis/database
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DEBUG_DB_PATH: /opt/jarvis/database/jarvis_debug_studio.sqlite
      TRACE_GATEWAY_INTERNAL_URL: http://jarvis_debug_studio:8060
      JARVIS_DEBUG_DB: /opt/jarvis/database/jarvis_debug_studio.sqlite
      JARVIS_DEBUG_MAX_CODE_LINES: 160
      TOOLBOX_RUNNER_URL: http://toolbox_runner:8030
      JARVIS_DEBUG_PROBE_TIMEOUT: 1.3
      JARVIS_DEBUG_MANUAL_PROBE_TIMEOUT: 12
    command: >
      bash -lc 'REQ=/app/services/jarvis_debug_studio/requirements.txt;
      [ -f "$$REQ" ] || REQ=services/jarvis_debug_studio/requirements.txt;
      if [ -f "$$REQ" ]; then
        pip install --no-cache-dir -r "$$REQ";
      else
        pip install --no-cache-dir fastapi uvicorn pydantic;
      fi;
      uvicorn services.jarvis_debug_studio.app:app --host 0.0.0.0 --port 8060'
    ports:
      - "4318:8060"
    networks:
      - jarvis_net

  git_bridge:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DRY_RUN: "true"
      TRACE_MONITOR_URL: ${JARVIS_TRACE_MONITOR_URL:-http://jarvis_debug_studio:8060}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_GATEWAY_URL: ${TRACE_GATEWAY_URL:-http://jarvis_debug_studio:8060}
      TRACE_CODE_PREVIEW: ${TRACE_CODE_PREVIEW:-true}
      TRACE_MAX_CODE_LINES: ${TRACE_MAX_CODE_LINES:-160}
    command: bash -lc "REQ=/app/services/git_bridge/requirements.txt; [ -f \"$$REQ\" ] || REQ=services/git_bridge/requirements.txt; if [ -f \"$$REQ\" ]; then pip install --no-cache-dir -r \"$$REQ\"; else pip install --no-cache-dir fastapi uvicorn pydantic; fi && uvicorn services.git_bridge.app:app --host 0.0.0.0 --port 8040"
    ports:
      - "8040:8040"
    networks:
      - jarvis_net

  log_bridge:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
      - ${JARVIS_LOGS_PATH:-./.data/logs}:/var/log/jarvis
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      LOG_BRIDGE_FILE: /var/log/jarvis/events.jsonl
      TRACE_MONITOR_URL: ${JARVIS_TRACE_MONITOR_URL:-http://jarvis_debug_studio:8060}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_GATEWAY_URL: ${TRACE_GATEWAY_URL:-http://jarvis_debug_studio:8060}
      TRACE_CODE_PREVIEW: ${TRACE_CODE_PREVIEW:-true}
      TRACE_MAX_CODE_LINES: ${TRACE_MAX_CODE_LINES:-160}
    command: bash -lc "REQ=/app/services/log_bridge/requirements.txt; [ -f \"$$REQ\" ] || REQ=services/log_bridge/requirements.txt; if [ -f \"$$REQ\" ]; then pip install --no-cache-dir -r \"$$REQ\"; else pip install --no-cache-dir fastapi uvicorn; fi && uvicorn services.log_bridge.app:app --host 0.0.0.0 --port 8050"
    ports:
      - "8050:8050"
    networks:
      - jarvis_net

networks:
  jarvis_net:
    external: true
