services:
  jarvis_debug_studio:
    image: python:3.11-slim
    container_name: jarvis_debug_studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
      - /opt/jarvis/database:/opt/jarvis/database
    environment:
      PYTHONPATH: /app
      DEBUG_DB_PATH: /opt/jarvis/database/jarvis_debug_studio.sqlite
      TRACE_GATEWAY_INTERNAL_URL: http://jarvis_debug_studio:8060
      JARVIS_DEBUG_DB: /opt/jarvis/database/jarvis_debug_studio.sqlite
      JARVIS_DEBUG_MAX_CODE_LINES: "160"
      TOOLBOX_RUNNER_URL: http://toolbox_runner:8030
      JARVIS_DEBUG_PROBE_TIMEOUT: "1.3"
      JARVIS_DEBUG_MANUAL_PROBE_TIMEOUT: "12"
    command: >
      bash -lc 'REQ=/app/services/jarvis_debug_studio/requirements.txt;
      [ -f "$$REQ" ] || REQ=services/jarvis_debug_studio/requirements.txt;
      if [ -f "$$REQ" ]; then
        pip install --no-cache-dir -r "$$REQ";
      else
        pip install --no-cache-dir fastapi uvicorn pydantic;
      fi;
      uvicorn services.jarvis_debug_studio.app:app --host 0.0.0.0 --port 8060'
    ports:
      - "4318:8060"
    networks:
      - jarvis_net

  toolbox_runner:
    image: python:3.11-slim
    container_name: jarvis_toolbox_runner
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${JARVIS_HOST_ROOT:-.}:/app
      - /opt/jarvis/database:/opt/jarvis/database
    environment:
      PYTHONPATH: /app
      TOOL_TIMEOUT_S: ${TOOL_TIMEOUT_S:-30}
      JARVIS_INFRA_DB: /opt/jarvis/database/jarvis.db
      TRACE_ENABLED: "true"
      TRACE_GATEWAY_URL: "http://jarvis_debug_studio:8060"
      TRACE_PAYLOADS: "true"
      TRACE_CODE_PREVIEW: "true"
      TRACE_MAX_CODE_LINES: "160"
    command: >
      bash -lc 'REQ=/app/services/toolbox_runner/requirements.txt;
      [ -f "$$REQ" ] || REQ=services/toolbox_runner/requirements.txt;
      if [ -f "$$REQ" ]; then
        pip install --no-cache-dir -r "$$REQ";
      else
        pip install --no-cache-dir fastapi uvicorn jsonschema pydantic;
      fi;
      uvicorn services.toolbox_runner.app:app --host 0.0.0.0 --port 8030'
    ports:
      - "8030:8030"
    networks:
      - jarvis_net

# navigateur
# http://HOST:4318

# communication interne docker
# http://jarvis_debug_studio:8060

networks:
  jarvis_net:
    external: true
