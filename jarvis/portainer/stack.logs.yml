version: "3.8"

name: jarvis

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  jarvis_loki:
    image: grafana/loki:3.0.0
    container_name: jarvis_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    networks:
      - jarvis_net
    volumes:
      - loki-data:/loki
      - /opt/jarvis/jarvis-logs/loki-config.yml:/etc/loki/config.yml:ro
    logging: *default-logging

  jarvis_promtail:
    image: grafana/promtail:3.0.0
    container_name: jarvis_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - jarvis_loki
    networks:
      - jarvis_net
    volumes:
      - /opt/jarvis/jarvis-logs/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/tmp
    logging: *default-logging

  jarvis_grafana:
    image: grafana/grafana:11.0.0
    container_name: jarvis_grafana
    restart: unless-stopped
    depends_on:
      - jarvis_loki
    ports:
      - "3011:3000"
    networks:
      - jarvis_net
      - proxy
    environment:
      TZ: Europe/Brussels
      GF_SECURITY_ADMIN_USER: jarvis
      GF_SECURITY_ADMIN_PASSWORD: ***REDACTED***
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    logging: *default-logging

volumes:
  loki-data:
  promtail-positions:
  grafana-data:

networks:
  jarvis_net:
    external: true
    name: jarvis_net
  proxy:
    external: true
    name: jarvis_proxy
