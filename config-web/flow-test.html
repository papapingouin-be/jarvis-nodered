<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis MCP - Test du flux de base</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: #f7f7fb; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 1rem 1.25rem; }
    header a { color: #93c5fd; text-decoration: none; }
    main { max-width: 960px; margin: 1rem auto 2rem; padding: 0 1rem; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    h1 { margin: 0; font-size: 1.15rem; }
    h2 { margin: 0 0 .75rem 0; font-size: 1rem; }
    label { display: block; font-size: .92rem; margin-bottom: .35rem; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; padding: .55rem .65rem; }
    textarea { min-height: 200px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .row { display: flex; gap: .75rem; flex-wrap: wrap; }
    .col { flex: 1; min-width: 300px; }
    button { border: none; border-radius: 8px; padding: .6rem .9rem; cursor: pointer; background: #2563eb; color: #fff; }
    button.secondary { background: #6b7280; }
    .status { margin-top: .75rem; font-size: .9rem; }
    .ok { color: #047857; }
    .err { color: #b91c1c; }
    .muted { color: #6b7280; }
    pre { background: #0b1020; color: #e5e7eb; padding: .8rem; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Jarvis MCP - Test du flux de base</h1>
    <div><a href="index.html">← Retour à la configuration SQLite</a></div>
  </header>

  <main>
    <section class="panel">
      <h2>Paramètres d'appel</h2>
      <label for="endpoint">Endpoint Node-RED</label>
      <input id="endpoint" placeholder="http://localhost:1880/jarvis/inbound" />
      <div class="muted" style="margin-top:.5rem;">Le payload est envoyé en JSON via POST.</div>
    </section>

    <section class="panel">
      <h2>Message d'entrée</h2>
      <textarea id="payload"></textarea>
      <div class="row" style="margin-top:.75rem;">
        <button id="sendBtn">Tester le flux</button>
        <button id="resetBtn" class="secondary">Réinitialiser le JSON</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="panel">
      <h2>Réponse</h2>
      <pre id="response" class="muted">Aucune requête envoyée.</pre>
    </section>
  </main>

  <script src="flow-test.js"></script>
</body>
</html>
