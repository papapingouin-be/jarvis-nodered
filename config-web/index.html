<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis DevLab</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#111827;color:#e5e7eb;margin:0}
header{padding:16px 20px;border-bottom:1px solid #374151;background:#1f2937;display:flex;gap:10px;align-items:center}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 14px;border:none;border-radius:10px;background:#2563eb;color:white;cursor:pointer}
button.secondary{background:#475569}
.panel{display:none;padding:20px}
.panel.active{display:block}
.card{max-width:1100px;margin:0 auto;background:#1f2937;border:1px solid #374151;border-radius:16px;padding:20px}
pre{background:#0b1220;border:1px solid #334155;border-radius:12px;padding:12px;overflow:auto;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#0b1220;border:1px solid #334155;color:#cbd5e1;font-size:.82rem}
a{color:#93c5fd}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:24px}
[hidden]{display:none !important}
.modal{width:min(1100px,96vw);max-height:90vh;overflow:auto;background:#111827;border:1px solid #374151;border-radius:16px;padding:18px}
.browser-grid{display:grid;grid-template-columns:1.2fr .9fr;gap:16px}
.browser-list{max-height:55vh;overflow:auto;border:1px solid #334155;border-radius:12px;padding:8px;background:#0b1220}
.browser-item{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:6px;background:#172033;border:1px solid #334155}
.browser-item.selected{outline:2px solid #60a5fa}
.db-path{padding:8px 10px;background:#0b1220;border:1px solid #334155;border-radius:10px;margin:8px 0}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e5e7eb}
</style>
</head>
<body>
<header>
  <strong>Jarvis DevLab</strong>
  <span id="uiVersion" class="badge">db-panel-v1</span>
  <nav>
    <button class="secondary" data-panel="dashboard">Dashboard</button>
    <button class="secondary" data-panel="tools">Tools</button>
    <button class="secondary" data-panel="runs">Runs</button>
    <button class="secondary" data-panel="code">Code</button>
    <button data-panel="db">DB</button>
    <button class="secondary" data-panel="logs">Logs</button>
  </nav>
</header>

<section id="panel-dashboard" class="panel active">
  <div class="card"><h2>Dashboard</h2><p>DevLab principal.</p></div>
</section>

<section id="panel-tools" class="panel"><div class="card"><h2>Tools</h2></div></section>
<section id="panel-runs" class="panel"><div class="card"><h2>Runs</h2></div></section>
<section id="panel-code" class="panel"><div class="card"><h2>Code</h2></div></section>
<section id="panel-logs" class="panel"><div class="card"><h2>Logs</h2><pre id="logBox">Aucun log.</pre></div></section>

<section id="panel-db" class="panel">
  <div class="card">
    <h2>Gestion DB</h2>
    <div id="dbStatus">Chargement…</div>
    <div class="row" style="margin-top:14px">
      <button id="selectDb" class="secondary" type="button">Sélectionner</button>
      <button id="createDb" type="button">Créer</button>
      <button id="uploadDb" class="secondary" type="button">Uploader</button>
      <button id="exportDb" class="secondary" type="button">Exporter / Télécharger</button>
      <button id="deleteDb" class="secondary" type="button">Effacer</button>
      <button id="closeDbPanel" class="secondary" type="button">Retour dashboard</button>
    </div>
    <div style="margin-top:16px">
      <h3>Détails DB</h3>
      <pre id="dbDetails">Aucun détail.</pre>
    </div>
  </div>
</section>

<div id="dbModal" class="modal-backdrop" hidden aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dbModalTitle">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 id="dbModalTitle" style="margin:0">Gestion DB</h2>
      <button id="dbActionCancel" class="secondary" type="button">Fermer</button>
    </div>
    <div class="browser-grid" style="margin-top:14px">
      <div>
        <div>Arborescence distante</div>
        <div id="dbBrowserPath" class="db-path">/var/www/jarvis/database</div>
        <div id="dbBrowserList" class="browser-list">Chargement…</div>
      </div>
      <div>
        <div>Action</div>
        <div id="dbActionBody" class="db-path">Choisis une action.</div>
        <div class="row" style="margin-top:10px">
          <button id="dbActionConfirm" type="button">Confirmer</button>
        </div>
        <pre id="dbActionOutput" style="margin-top:12px;min-height:140px">Aucune action.</pre>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
