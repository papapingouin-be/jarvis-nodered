<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis MCP - Config outils</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color-scheme: light;
    }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 1rem 1.25rem; }
    main { max-width: 960px; margin: 1rem auto 2rem; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; margin-bottom: .9rem; }
    .editor-card { margin-bottom: .7rem; }
    h1 { margin: 0; font-size: 1.1rem; }
    h2 { margin: 0 0 .75rem; font-size: 1rem; }
    .subtle { color: #6b7280; font-size: .9rem; }
    label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; }
    input, select { border: 1px solid #d1d5db; border-radius: 8px; padding: .5rem .6rem; background: #fff; }
    button { border: none; border-radius: 8px; padding: .5rem .8rem; cursor: pointer; background: #1f2937; color: #fff; }
    button.danger { background: #b91c1c; }
    .row { display: flex; gap: .45rem; flex-wrap: wrap; align-items: end; }
    .status { margin-top: .5rem; font-size: .9rem; }
    .ok { color: #047857; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <h1>Jarvis MCP - Configuration des outils</h1>
  </header>

  <main>
    <section class="card">
      <h2>Base SQLite</h2>
      <div class="row">
        <label style="min-width:360px; flex:1">
          Chemin DB SQLite (serveur)
          <input id="dbPath" placeholder="/tmp/jarvis_infra.db" />
        </label>
        <button id="reloadAll">Recharger</button>
      </div>
      <div class="subtle">Par défaut: <code>JARVIS_INFRA_DB</code> puis <code>/tmp/jarvis_infra.db</code>.</div>
      <div id="globalStatus" class="status"></div>
    </section>

    <section class="card">
      <h2>Configuration simple</h2>
      <div class="subtle">Choisissez un outil, visualisez les valeurs actuelles, modifiez et sauvegardez au même endroit.</div>
      <div class="row" style="margin-top:.7rem;">
        <label style="min-width:280px; flex:1">Outil
          <select id="cfgTool"></select>
        </label>
      </div>
      <div id="configEditor" style="margin-top:.7rem;"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
