<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jarvis DevLab</title>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#0b1020;
    color:white;
}

#layout{
    display:flex;
    height:100vh;
}

#services{
    width:260px;
    background:#121a2b;
    border-right:1px solid #22304d;
    padding:10px;
}

#services button{
    width:100%;
    margin-bottom:6px;
    padding:8px;
}

#main{
    flex:1;
    padding:20px;
}

#editor{
    height:500px;
    border:1px solid #333;
}
</style>

</head>

<body>

<div id="layout">

<div id="services">
<h3>Services</h3>
<div id="serviceList"></div>
</div>

<div id="main">

<h2 id="serviceTitle">Service</h2>

<div>
<button onclick="showConfig()">Configurer</button>
<button onclick="showTest()">Tester</button>
<button onclick="showCode()">Code</button>
<button onclick="showRuns()">Historique</button>
</div>

<hr>

<div id="view"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="app.js"></script>

</body>
</html>
